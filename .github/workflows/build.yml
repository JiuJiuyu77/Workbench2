name: build

# Workbench 2 构建流水线
#   · 大体积依赖一律在 CI 内下载，不进仓库：
#       Theos 运行时（theos-full + theos-root + helpers，259MB）
#       OLLVM / 逆向工具（81MB）、Swift 5.9.2（469MB）
#       iOS 17.0 / 26.5 SDK（按需，运行时下载）
#   · 内置 16.5 SDK 以 Resources/SDK16.5.tar.gz 随仓库分发（30MB）

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 选择最新 Xcode
        run: |
          set -euo pipefail
          echo "==> 可用 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          BEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$BEST" ]; then
            echo "==> 选用 $BEST"
            sudo xcode-select -s "$BEST"
          fi
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 校验内置 SDK
        run: |
          set -euo pipefail
          test -f Resources/SDK16.5.tar.gz || { echo "::error::缺 Resources/SDK16.5.tar.gz"; exit 1; }
          ls -lh Resources/SDK16.5.tar.gz
          tar tzf Resources/SDK16.5.tar.gz | head -3

      # 链接固定使用 Xcode 自带的 iPhoneOS SDK。
      # 之前这里把 Release 里的 iPhoneOS26.5.sdk 传给 --sdk-root 当 sysroot，
      # 结果 ld64 解析它的 .tbd 时把所有系统符号（NSArray/usleep/…）都当成未定义，
      # 链接必然失败。SDK 26 的离线包只用于 App 内工具链，不参与宿主链接。
      - name: 选择链接用 SDK
        id: sdk26
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          VER="$(/usr/libexec/PlistBuddy -c 'Print :Version' "$SDK/SDKSettings.plist" 2>/dev/null || echo unknown)"
          echo "SDK: $SDK ($VER)"
          case "$VER" in 26.*) ;; *) echo "::warning::Xcode 自带 SDK 为 $VER，低于 26";; esac
          echo "path=$SDK" >> "$GITHUB_OUTPUT"

      - name: 安装 LLVM（提供 ld.lld）
        run: |
          set -euo pipefail
          # LLVM 23 起 Homebrew 把 LLD 拆成独立 formula（llvm 里只剩 clang 工具），
          # 所以 ld.lld 既不在 PATH，也不在 /opt/homebrew/opt/llvm/bin 里。
          # 依次探测：PATH → llvm keg → lld keg → 系统路径。
          find_lld() {
            command -v ld.lld 2>/dev/null && return 0
            for c in /opt/homebrew/opt/lld/bin/ld.lld \
                     /opt/homebrew/opt/llvm/bin/ld.lld \
                     /usr/local/opt/lld/bin/ld.lld \
                     /usr/local/opt/llvm/bin/ld.lld \
                     /opt/homebrew/opt/llvm/bin/lld; do
              [ -x "$c" ] && { echo "$c"; return 0; }
            done
            return 1
          }
          LLD="$(find_lld || true)"
          if [ -z "$LLD" ]; then
            echo "==> 安装 lld / llvm"
            brew install lld llvm || brew install lld || true
            LLD="$(find_lld || true)"
          fi
          if [ -z "$LLD" ]; then
            LLD="$(find /opt/homebrew /usr/local -maxdepth 6 -name 'ld.lld' -type f 2>/dev/null | head -1)"
          fi
          test -n "$LLD" || {
            echo "::error::找不到 ld.lld"
            ls -la /opt/homebrew/opt/ 2>/dev/null || true
            brew list --formula 2>/dev/null | grep -i lld || true
            exit 1
          }
          echo "LD.LD = $LLD"
          "$LLD" --version || true
          # build_ish.py 用它链接 iSH 的 guest ELF 二进制
          echo "WORKBENCH_LLD=$LLD" >> "$GITHUB_ENV"

      - name: 安装 Rust iOS 目标
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          rustup target list --installed
          cargo --version
          rustc --version

      - name: 缓存 Theos 运行时（全内置）
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: BundledToolchain.tar.gz
          key: theos-runtime-v3-${{ hashFiles('Resources/DownloadResources.json') }}

      - name: 下载 Theos 运行时（缺缓存时）
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="$(python3 -c "import json;print([r for r in json.load(open('Resources/DownloadResources.json')) if r['id']=='theos-toolchain'][0]['url'])")"
          echo "==> $URL"
          curl -L --retry 3 --retry-delay 5 -o BundledToolchain.tar.gz "$URL"
          ls -lh BundledToolchain.tar.gz
          SHA="$(python3 -c "import json;print([r for r in json.load(open('Resources/DownloadResources.json')) if r['id']=='theos-toolchain'][0]['sha256'])")"
          echo "$SHA  BundledToolchain.tar.gz" | shasum -a 256 -c -

      - name: 缓存 OLLVM / 逆向工具
        id: extras-cache
        uses: actions/cache@v4
        with:
          path: WorkbenchExtras.tar.gz
          key: theos-extras-${{ hashFiles('Resources/DownloadResources.json') }}

      - name: 下载 OLLVM / 逆向工具（缺缓存时）
        if: steps.extras-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="$(python3 -c "import json;print([r for r in json.load(open('Resources/DownloadResources.json')) if r['id']=='theos-extras'][0]['url'])")"
          curl -L --retry 3 --retry-delay 5 -o WorkbenchExtras.tar.gz "$URL"
          SHA="$(python3 -c "import json;print([r for r in json.load(open('Resources/DownloadResources.json')) if r['id']=='theos-extras'][0]['sha256'])")"
          echo "$SHA  WorkbenchExtras.tar.gz" | shasum -a 256 -c -

      - name: 缓存 Swift 工具链
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: SwiftToolchain.tar.gz
          key: swift-toolchain-v2-${{ hashFiles('Resources/DownloadResources.json') }}

      - name: 下载 Swift 工具链（缺缓存时）
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="$(python3 -c "import json;print([r for r in json.load(open('Resources/DownloadResources.json')) if r['id']=='swift-toolchain'][0]['url'])")"
          curl -L --retry 3 --retry-delay 5 -o SwiftToolchain.tar.gz "$URL"
          SHA="$(python3 -c "import json;print([r for r in json.load(open('Resources/DownloadResources.json')) if r['id']=='swift-toolchain'][0]['sha256'])")"
          echo "$SHA  SwiftToolchain.tar.gz" | shasum -a 256 -c -
          ls -lh SwiftToolchain.tar.gz

      - name: 展开内置工具链
        run: |
          set -euo pipefail
          rm -rf BundledToolchain && mkdir -p BundledToolchain
          tar xzf BundledToolchain.tar.gz -C BundledToolchain
          # 压缩包可能只有一层顶层目录：压平，保持 theos-root/ helpers/ sdks/ 在 Toolchain 根
          # macOS 的 /bin/bash 是 3.2，没有 mapfile；只用 POSIX 命令
          COUNT=$(ls -A BundledToolchain | wc -l | tr -d ' ')
          if [ "$COUNT" = "1" ]; then
            TOP=$(ls -A BundledToolchain)
            if [ -d "BundledToolchain/$TOP" ]; then
              echo "==> 压平 $TOP"
              cp -R "BundledToolchain/$TOP/." BundledToolchain/
              rm -rf "BundledToolchain/$TOP"
            fi
          fi
          tar xzf WorkbenchExtras.tar.gz -C BundledToolchain
          ls BundledToolchain | head -20
          du -sh BundledToolchain
          # 重新打包过的 extras 可能丢了执行位；统一恢复，再按目录补 +x
          chmod -R u+rwX,go+rX BundledToolchain
          for d in ollvm/bin reverse/bin theos-root/usr/bin theos-root/usr/lib/llvm-16/bin helpers; do
            [ -d "BundledToolchain/$d" ] && find "BundledToolchain/$d" -type f -exec chmod +x {} +
          done
          test -x BundledToolchain/ollvm/bin/clang || { echo "::error::缺 ollvm/bin/clang"; exit 1; }
          # Swift 工具链：预解包的 usr/ 布局，直接展开即可（安装器按 swift-toolchain/usr/bin 找 swiftc）
          rm -rf BundledToolchain/swift-toolchain
          mkdir -p BundledToolchain/swift-toolchain
          tar xzf SwiftToolchain.tar.gz -C BundledToolchain/swift-toolchain
          chmod -R u+rwX,go+rX BundledToolchain/swift-toolchain
          test -x BundledToolchain/swift-toolchain/usr/bin/swiftc || { echo "::error::缺 swiftc"; ls BundledToolchain/swift-toolchain/usr/bin | head; exit 1; }
          echo "---- 关键组件自检 ----"
          for f in theos-root/usr/bin/clang-16 theos-root/usr/bin/ldid theos-root/usr/bin/make theos-root/usr/bin/perl ollvm/bin/clang reverse/bin/mt-macho; do
            if [ -e "BundledToolchain/$f" ]; then echo "  OK  $f"; else echo "  MISS $f"; fi
          done
          ls BundledToolchain/reverse/bin | head -5

      - name: 裁剪内置工具链
        run: |
          set -euo pipefail
          python3 scripts/prune_toolchain.py BundledToolchain
          du -sh BundledToolchain
          du -sh BundledToolchain/swift-toolchain

      - name: 安装 meson / ninja（iSH 沙盒构建）
        run: |
          set -euo pipefail
          # build_ish.py 用 meson+ninja 生成 iSH 的 guest 运行时；
          # 之前 CI 里没有这两个工具，iSH 组件每次都静默降级。
          brew install meson ninja
          meson --version
          ninja --version

      - name: 体积核对
        run: |
          set -euo pipefail
          du -sh BundledToolchain
          du -sh BundledToolchain/swift-toolchain || echo "no swift-toolchain"
          ls BundledToolchain/swift-toolchain/usr/bin | head -5 || true

      - name: 构建
        id: build
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/build.py --identity - --bundle-id com.HuQing.Workbench 2>&1 | tee /tmp/build.log
          echo "---- 产物 ----"
          ls -lh build/*.ipa 2>/dev/null || true

      - name: 核验 ipa 内容
        run: |
          set -euo pipefail
          du -sh build/device/Workbench.app/Toolchain
          du -sh build/device/Workbench.app/Toolchain/swift-toolchain || true
          unzip -l build/*.ipa | grep -c "Toolchain/swift-toolchain" || echo "0 swift entries"
          unzip -l build/*.ipa | tail -1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Workbench2-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 失败时打印日志尾部
        if: failure()
        run: tail -100 /tmp/build.log || true

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: Workbench2-ipa
          path: dist

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: Workbench ${{ github.ref_name }}
          files: dist/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
