name: ios-tools-build

# 用 git 源码在 macos-15 上交叉编译 iOS(arm64) 版 Theos 依赖工具。
#
# 顺序与依赖：
#   1) libtapi —— 两段式：先用 macOS clang 编 tblgen（宿主工具），
#      再用 LLVM_TABLEGEN / CLANG_TABLEGEN 指向宿主工具，把 tapi 交叉编成 iOS arm64。
#   2) GNU make 4.4.1 —— 直接用 ftp.gnu.org 的 tarball（mirror/make 的 4.4.1 是
#      annotated tag，--depth 1 --branch 拿不到）。
#   3) ld64 —— ld64.xcodeproj 只有 `ld` target（没有 ld64），编译 textstub_dylib_file.cpp
#      需要 libtapi 的头与库；所以必须等 1) 成功。
#
# 每个组件 continue-on-error，成功几个就发几个；产物发布到 Release `ios-tools-latest`。

on:
  workflow_dispatch:
    inputs:
      make_version:
        description: 'GNU make 版本'
        required: false
        default: '4.4.1'
      ld64_ref:
        description: 'ld64 分支/tag（git）'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 准备工具链环境
        run: |
          set -euo pipefail
          mkdir -p out/usr/bin out/usr/lib out/usr/include
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          {
            echo "SDK=$SDK"
            echo "IOSCC=$(xcrun --sdk iphoneos -f clang)"
            echo "IOSCXX=$(xcrun --sdk iphoneos -f clang++)"
            echo "HOSTCC=/usr/bin/clang"
            echo "HOSTCXX=/usr/bin/clang++"
            echo "IOSFLAGS=-arch arm64 -isysroot $SDK -miphoneos-version-min=15.0 -O2 -Wno-error -Wno-everything"
          } >> "$GITHUB_ENV"
          swift --version || true
          cmake --version | head -1
          ninja --version

      # ---------------- 1) libtapi（两段式交叉编译） ----------------
      - name: libtapi 源码
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive --shallow-submodules https://github.com/tpoechtrager/apple-libtapi.git tapi
          cd tapi && git log --oneline -1 && ls src/llvm-project | head

      - name: libtapi 宿主 tblgen（macOS）
        continue-on-error: true
        run: |
          set -euo pipefail
          cd tapi
          cmake -S src/llvm-project/llvm -B /tmp/hostllvm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$HOSTCC" -DCMAKE_CXX_COMPILER="$HOSTCXX" \
            -DLLVM_TARGETS_TO_BUILD=host -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_PROJECTS= 2>&1 | tail -8
          cmake --build /tmp/hostllvm --target llvm-tblgen llvm-min-tblgen -j8 2>&1 | tail -15 || \
            cmake --build /tmp/hostllvm --target llvm-tblgen -j8 2>&1 | tail -15
          ls /tmp/hostllvm/bin | head -10
          cmake -S src/llvm-project/clang -B /tmp/hostclang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$HOSTCC" -DCMAKE_CXX_COMPILER="$HOSTCXX" \
            -DLLVM_DIR=/tmp/hostllvm/lib/cmake/llvm -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF 2>&1 | tail -8
          cmake --build /tmp/hostclang --target clang-tblgen -j8 2>&1 | tail -10 || true
          ls /tmp/hostclang/bin | head -5 || true

      - name: libtapi（iOS arm64）
        continue-on-error: true
        run: |
          set -euo pipefail
          cd tapi
          TBL="$(ls /tmp/hostllvm/bin/llvm-tblgen 2>/dev/null || true)"
          CTBL="$(ls /tmp/hostclang/bin/clang-tblgen 2>/dev/null || true)"
          echo "LLVM_TABLEGEN=$TBL CLANG_TABLEGEN=$CTBL"
          cmake -S src/llvm-project/tapi -B /tmp/tapiios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$IOSCC" -DCMAKE_CXX_COMPILER="$IOSCXX" \
            -DCMAKE_C_FLAGS="$IOSFLAGS" -DCMAKE_CXX_FLAGS="$IOSFLAGS" \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDK" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/../out/usr" \
            ${TBL:+-DLLVM_TABLEGEN="$TBL"} ${CTBL:+-DCLANG_TABLEGEN="$CTBL"} \
            -DTAPI_INCLUDE_TESTS=OFF -DTAPI_INCLUDE_DOCS=OFF \
            -DTAPI_REPOSITORY_STRING=iOS 2>&1 | tail -15
          cmake --build /tmp/tapiios -j8 2>&1 | tail -20 || { echo "::warning::libtapi 构建失败"; exit 0; }
          cmake --install /tmp/tapiios 2>&1 | tail -8 || true
          find ../out -name 'libtapi*' -o -name 'tapi' | head -10

      # ---------------- 2) GNU make ----------------
      - name: GNU make
        continue-on-error: true
        run: |
          set -euo pipefail
          V="${{ inputs.make_version }}"
          rm -rf makesrc make.tar.gz
          curl -L --retry 3 -o make.tar.gz "https://ftp.gnu.org/gnu/make/make-${V}.tar.gz"
          mkdir -p makesrc && tar xzf make.tar.gz -C makesrc --strip-components=1
          cd makesrc
          make distclean >/dev/null 2>&1 || true
          ac_cv_type_uintmax_t=yes ac_cv_type_intmax_t=yes ac_cv_type_long_long_int=yes \
          ac_cv_func_mkstemp=yes \
          ./configure --host=arm64-apple-darwin --disable-nls --without-guile \
            CC="$IOSCC" CFLAGS="$IOSFLAGS" LDFLAGS="-arch arm64 -isysroot $SDK" \
            2>&1 | tail -10 || { echo "::warning::make configure 失败"; exit 0; }
          make -j8 2>&1 | tail -20 || { echo "::warning::make 构建失败"; exit 0; }
          if [ -x src/make ]; then
            cp src/make ../out/usr/bin/make && chmod +x ../out/usr/bin/make
            file ../out/usr/bin/make
          else
            echo "::warning::make 未产出 src/make"
          fi

      # ---------------- 3) ld64（依赖 libtapi） ----------------
      - name: ld64（git）
        continue-on-error: true
        run: |
          set -euo pipefail
          REF="${{ inputs.ld64_ref }}"
          rm -rf ld64src
          git clone --depth 1 --branch "$REF" https://github.com/apple-oss-distributions/ld64.git ld64src || \
            git clone --depth 1 https://github.com/apple-oss-distributions/ld64.git ld64src
          cd ld64src && git log --oneline -1
          TAPI_INC="$PWD/../out/usr/include"
          TAPI_LIB="$PWD/../out/usr/lib"
          EXTRA=""
          if [ -d "$TAPI_INC/tapi" ] || [ -f "$TAPI_INC/tapi/tapi.h" ]; then
            EXTRA="HEADER_SEARCH_PATHS=$TAPI_INC LIBRARY_SEARCH_PATHS=$TAPI_LIB OTHER_LDFLAGS=-ltapi"
            echo "libtapi: 已接入"
          else
            echo "::warning::libtapi 未就绪，ld64 可能编不过"
          fi
          xcodebuild -project ld64.xcodeproj -target ld \
            -configuration Release -sdk iphoneos ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO $EXTRA \
            CONFIGURATION_BUILD_DIR="$PWD/build_out" build 2>&1 | tail -20 || true
          BIN="$(find . -name ld64 -o -name ld | grep -E '/build_out/|/ld64$' | head -1)"
          if [ -z "$BIN" ]; then echo "::warning::ld64 未编出"; exit 0; fi
          cp "$BIN" ../out/usr/bin/ld64 && chmod +x ../out/usr/bin/ld64
          file ../out/usr/bin/ld64

      # ---------------- 打包发布 ----------------
      - name: 打包 + 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "--- 产物 ---"
          find out -type f -exec ls -lh {} \; | head -20 || true
          if [ -z "$(find out -type f -print -quit)" ]; then echo "::warning::没有任何产物"; exit 0; fi
          tar czf ios-tools.tar.gz -C out usr
          ls -lh ios-tools.tar.gz
          shasum -a 256 ios-tools.tar.gz | tee ios-tools.sha256
          TAG="ios-tools-latest"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --title "自编 Theos 工具（iOS arm64）" \
            --notes "libtapi / GNU make / ld64 的 arm64-apple-ios 构建（.github/workflows/ios-tools-build.yml）。"
          gh release upload "$TAG" ios-tools.tar.gz ios-tools.sha256 --clobber
