name: probe

# 诊断用：只跑 Linux runner，验证 Actions 通路是否正常
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: system
        run: |
          uname -a
          python3 --version
      - name: syntax
        run: |
          python3 -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('scripts').glob('*.py')]"
          echo "python syntax OK"
